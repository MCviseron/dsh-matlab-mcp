# CI: the committed build output must stay in sync with `src/`, and it must be
# loadable exactly the way DSH loads it.
#
# `lib/` is committed on purpose — DSH links this plugin by path, so a fresh
# clone must be loadable without running a build. That only stays honest if a
# stale or broken `lib/` fails here.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck 2>&1 | tee /tmp/typecheck.log
      - name: Unit tests
        run: pnpm test 2>&1 | tee /tmp/test.log
      - name: Build bundles
        run: pnpm build 2>&1 | tee /tmp/build.log
      - name: lib/ must match a fresh build
        run: |
          if ! git diff --quiet -- lib; then
            echo "::error::lib/ is stale — run 'pnpm build' and commit the result."
            git --no-pager diff --stat -- lib
            git --no-pager diff -- lib | tail -c 2200 > /tmp/libdiff.txt
            echo "::error title=lib diff::$(sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g' /tmp/libdiff.txt)"
            exit 1
          fi
      - name: the host bundle must be self-contained
        run: |
          if grep -qE "from ['\"]@deepseek-ai/" lib/index.js; then
            echo "::error::lib/index.js still imports @deepseek-ai/* — a fresh clone would fail to import."
            exit 1
          fi
      - name: inlined CJS dependencies must have their globals
        run: |
          # Bundling a CJS dependency into ESM rewrites its require() into a shim
          # that throws "Dynamic require of ... is not supported" unless the
          # bundle defines `require` itself. This broke plugin loading once.
          for token in createRequire import.meta.url __dirname __filename; do
            grep -q "$token" lib/index.js || {
              echo "::error::lib/index.js is missing '$token' — inlined CJS dependencies will throw at import time."
              exit 1
            }
          done
      - name: the host bundle must import cleanly
        run: |
          node -e "import('./lib/index.js').then(m => { if (typeof m.apply !== 'function' || typeof m.inject === 'undefined') throw new Error('plugin exports missing'); console.log('import ok:', Object.keys(m).join(',')) })"

      - name: Report the failing leg
        if: failure()
        run: |
          for f in /tmp/typecheck.log /tmp/test.log /tmp/build.log; do
            [ -f "$f" ] || continue
            tail -c 1800 "$f" > /tmp/tail.txt
            echo "::error title=$f::$(sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g' /tmp/tail.txt)"
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/tail.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
