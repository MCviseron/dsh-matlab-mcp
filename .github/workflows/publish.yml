# Publish to npm.
#
# Two ways to authenticate, in order of preference:
#
#  1. **Trusted publishing (OIDC)** — no token, no OTP, and npm signs a
#     provenance attestation linking the tarball to this repo and workflow.
#     Requires a one-time setup on npmjs.com:
#       package → Settings → Trusted Publisher → GitHub Actions
#       Organization/user: MCviseron   Repository: dsh-matlab-mcp
#       Workflow filename: publish.yml   Environment: (leave empty)
#     NOTE: the package must already exist on npm before a trusted publisher can
#     be configured — the *first* release is therefore published manually with
#     `npm publish --otp=…`, and every release after that can come from here.
#
#  2. **NPM_TOKEN secret** — a granular access token with "bypass 2FA" enabled,
#     stored as the repository secret NPM_TOKEN. npm is restricting bypass-2FA
#     tokens for direct publishing, so treat this as the fallback.
#
# Usage: push a tag (`git tag v0.7.2 && git push origin v0.7.2`) or run this
# workflow manually (dry-run packs without publishing).
name: publish
# Trusted Publisher 字段（npmjs.com → 该包 → Settings → Trusted Publisher → GitHub Actions）:
#   Organization or user : MCviseron
#   Repository           : dsh-matlab-mcp
#   Workflow filename    : publish.yml
#   Environment          : （留空）

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Package only, do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # OIDC: trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted publishing (OIDC) and staged publishing both need a recent npm.
      # npm 12 requires Node ^22.22.2 || ^24.15 || >=26, hence node-version 24 above.
      - name: Use a recent npm
        run: npm install -g npm@latest && npm --version

      - run: pnpm install --frozen-lockfile

      # Split the gate into named steps: the job summary then says which leg
      # failed, and the failure tail is emitted as an annotation (which is
      # readable through the public check-runs API, unlike the raw log).
      - name: Typecheck
        run: pnpm typecheck 2>&1 | tee /tmp/typecheck.log
      - name: Unit tests
        run: pnpm test 2>&1 | tee /tmp/test.log
      - name: Build bundles
        run: pnpm build 2>&1 | tee /tmp/build.log
      - name: Report the failing leg
        if: failure()
        run: |
          for f in /tmp/typecheck.log /tmp/test.log /tmp/build.log; do
            [ -f "$f" ] || continue
            tail -c 1800 "$f" > /tmp/tail.txt
            echo "::error title=$f::$(sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g' /tmp/tail.txt)"
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/tail.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: The git tag must match package.json
        run: |
          node -e "
            const v = require('./package.json').version;
            const tag = process.env.GITHUB_REF_NAME ?? '';
            if (tag.startsWith('v') && tag.slice(1) !== v) {
              console.error('tag ' + tag + ' does not match package.json ' + v);
              process.exit(1);
            }
            console.log('version ' + v + ' (tag ' + (tag || 'none') + ')');
          "

      - name: Pack only (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: npm pack --dry-run

      - name: Publish
        if: ${{ github.event_name == 'push' || !inputs.dry-run }}
        run: npm publish --access public --provenance
        # No NODE_AUTH_TOKEN here on purpose: npm authenticates with the OIDC
        # token above. An empty NODE_AUTH_TOKEN would be sent as a bearer token
        # and break the exchange. If you ever switch to a granular access token
        # instead of a trusted publisher, add back:
        #   env: { NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} }
